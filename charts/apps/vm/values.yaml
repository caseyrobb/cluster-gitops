# KubeVirt workload chart (workloads ApplicationSet: charts/apps/<name> ->
# namespace <name>, project: workloads). Renders DataVolumes for bootable
# disk images pulled via CDI http import.
#
# Master switch for the whole chart; per-cluster overlays set false to
# prune (app stays Synced/Healthy rendering nothing).
enabled: true

# Destination namespace name only. The chart MUST NOT render a Namespace
# resource: Namespace is cluster-scoped and the workloads AppProject denies
# cluster-scoped resources by design (its sync is rejected outright:
# "resource :Namespace is not permitted in project workloads"). The
# workloads ApplicationSet's CreateNamespace=true creates/adopts it.
namespace:
  name: vm

# Bootable DataVolumes, one map entry per volume (DataVolume name = key).
# FCOS `-kubevirt.` ociarchive images are a tar containing the raw disk;
# modern CDI auto-detects the format (the old `sourceFormat` field was
# removed from the CRD and would be silently pruned), no intermediate
# containerImage step needed.
#
# volumeMode: Block is REQUIRED for KubeVirt rootfs disks (a Block-mode
# DV attaches to a VM; Filesystem-mode works but pays ext4 overhead and
# topolvm block provisioning is the supported kubevirt path).
# preallocation: true avoids runtime ENOSPC surprises on the thin pool by
# zeroing the LV up front (renders at spec level — verified against the
# installed CDI CRD; under storage it is rejected).
dataVolumes:
  fedora-coreos-44:
    size: 10Gi
    storageClass: lvms-vg1
    volumeMode: Block
    accessModes:
      - ReadWriteOnce
    preallocation: true
    httpSourceURL: https://builds.coreos.fedoraproject.org/prod/streams/stable/builds/44.20261023.3.1/x86_64/fedora-coreos-44.20261023.3.1-kubevirt.x86_64.ociarchive
