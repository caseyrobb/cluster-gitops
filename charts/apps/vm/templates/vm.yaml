{{- if .Values.enabled }}
{{- range $name, $vm := .Values.vms }}
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace.name }}
  annotations:
    # The VirtualMachine CRD is owned by the OpenShift Virtualization
    # operator, not by Git.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    {{- if $vm.networks.lanEnabled }}
    k8s.v1.cni.cncf.io/networks: '[{"name": "{{ $vm.networks.lanNad }}", "interface": "lan0"}]'
    {{- end }}
  labels:
    app.kubernetes.io/name: {{ $.Chart.Name }}
spec:
  runStrategy: {{ $vm.runStrategy | default "Always" }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $.Chart.Name }}
        app.kubernetes.io/instance: {{ $name }}
    spec:
      domain:
        cpu:
          cores: {{ $vm.cpu }}
        memory:
          guest: {{ $vm.memory }}
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: datadisk
              disk:
                bus: virtio
          interfaces:
            # MACs are declared, not generated: the guest NetworkManager
            # keyfile binds the static LAN profile by MAC, so NIC PCI
            # enumeration order (enp2s0 vs enp3s0) can never break it.
            - name: default
              macAddress: {{ $vm.macAddresses.default }}
              masquerade: {}
              # Masquerade is userspace SLIRP: only ports declared here are
              # forwarded into the guest from the launcher pod (Services).
              {{- with $vm.ports }}
              ports:
                {{- toYaml . | nindent 16 }}
              {{- end }}
            {{- if $vm.networks.lanEnabled }}
            - name: lan0
              macAddress: {{ $vm.macAddresses.lan }}
              {{- if $vm.networks.lanBinding }}
              # Registered on the HyperConverged CR (macvlan -> managedTap);
              # the legacy bridge binding cannot wire a macvlan child.
              binding:
                name: {{ $vm.networks.lanBinding }}
              {{- else }}
              bridge: {}
              {{- end }}
            {{- end }}
      evictionStrategy: {{ $vm.evictionStrategy | default "LiveMigrate" }}
      networks:
        - name: default
          pod: {}
        {{- if $vm.networks.lanEnabled }}
        - name: lan0
          multus:
            networkName: {{ $vm.networks.lanNad }}
        {{- end }}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: rootdisk
          dataVolume:
            name: {{ $name }}-root
        - name: datadisk
          persistentVolumeClaim:
            claimName: {{ $vm.dataDisk.pvcName }}
        {{- range $sv := $vm.secretVolumes }}
        # Secret volumes arrive as iso9660 cdroms labeled cfgdata (not
        # virtiofs on this CNV — live-verified); the guest mounts the
        # label at /run/secrets/pangolin and podman quadlet units read
        # EnvironmentFile from there. Nothing secret is written to the
        # disk image.
        - name: {{ $sv }}
          secret:
            secretName: {{ $sv }}
        {{- end }}
        - name: cloudinit
          # ConfigDrive, not NoCloud: Ignition does not implement the
          # NoCloud datasource (that is cloud-init only). Requires the
          # kernel argument ignition.platform.id=openstack, which is baked
          # into the golden image's BLS entry (CNV 4.22 CRD gained no
          # domain.bootloader.kernelArguments). A cidata-labeled NoCloud
          # ISO is ignored outright by Ignition -- only ConfigDrive works.
          cloudInitConfigDrive:
            secretRef:
              name: {{ $vm.cloudInit.secretName }}
  dataVolumeTemplates:
    # Root disk: cloned from the golden-image DataSource (RWO lvms clone).
    # Ephemeral by design — FCOS is immutable; all state lives on the data
    # disk PVC.
    - metadata:
        name: {{ $name }}-root
        annotations:
          # LVMS is WaitForFirstConsumer; the populator clone deadlocks
          # ('waiting for first consumer') without bind.immediate — same
          # lesson as the golden DV (PR #24), now proven on the clone path.
          cdi.kubevirt.io/storage.bind.immediate.requested: "true"
      spec:
        # Must MATCH the golden DataSource's contentType (archive), and
        # CDI forbids Block volumeMode for archive (verified live:
        # 'Source contentType (archive) and target contentType (kubevirt)
        # do not match', then 'ContentType Archive cannot have block
        # volumeMode'). The clone is an FS copy carrying disk.img.
        contentType: {{ $vm.rootDisk.contentType | default "archive" }}
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: {{ $vm.rootDisk.size }}
          storageClassName: {{ $.Values.storageClass }}
          volumeMode: Filesystem
        # Embedded-DV-schema sourceRef: kind/name/namespace only — no
        # apiGroup (verified against the product VM CRD; the standalone
        # DataVolume CRD's dataSourceRef does not apply here).
        sourceRef:
          kind: DataSource
          name: {{ $vm.rootDisk.dataSource }}
        preallocation: false
{{- end }}
{{- end }}
