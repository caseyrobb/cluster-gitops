{{- if .Values.acme.enabled }}
{{- /*
  Cloudflare API token (Zone/DNS/Edit scoped to the target zone) flows:
  Vault chaos/data/<vaultPath>  --(ESO ClusterSecretStore 'vault')-->  this
  secret in the cert-manager namespace, refreshed hourly. No static
  credential in Git or in any human's shell history.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.acme.tokenSecret.name }}
  namespace: {{ .Values.acme.certManagerNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: issuer
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.acme.secretStore }}
  target:
    name: {{ .Values.acme.tokenSecret.name }}
  data:
  - secretKey: {{ .Values.acme.tokenSecret.key }}
    remoteRef:
      key: {{ .Values.acme.vaultPath }}
      property: {{ .Values.acme.tokenSecret.key }}
{{- end }}
