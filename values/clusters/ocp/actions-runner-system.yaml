# ARC v2 (autoscaling runner scale sets) for the OCP cluster.
# Controller is credential-less; the GitHub PAT lives in Vault
# (chaos/data/ocp/arc, key github_token) and syncs via ESO to the
# caseyrobb-github-config secret. Scale set is org-scoped:
# ARC v2 has NO personal-user scope (user URLs 404 on the orgs/
# registration-token endpoint), so it must be enterprise/org/repo.
#
# Job targeting: workflows use `runs-on: arc-ocp` (the scale-set NAME).
# Do NOT rely on scaleSetLabels for routing until upstream
# actions-runner-controller#4579 / actions/scaleset#140 are fixed —
# GitHub silently ignores scale-set label create/update. Changing
# runnerScaleSetName recreates the GitHub-side set (new message queue).
#
# Smoke-verified 2026-11-13: crobb-org/arc-smoke-test jobs completed on
# self-hosted ephemeral runners in this namespace.
enabled: true
scaleSet:
  enabled: true
gha-runner-scale-set:
  githubConfigUrl: https://github.com/crobb-org
  runnerScaleSetName: arc-ocp
  scaleSetLabels:
    - ocp
  minRunners: 0
