# Portal secrets come from Vault (chaos mount) via ESO — never Git, never
# `oc create secret`. Key layout mirrors the cert-manager/cloudflare pattern:
# remoteRef.key is the path under the `chaos` KV-v2 mount.
#
# Secret names are chart-fixed:
#   secrets-rhaap-portal                        (upstream chart env secretKeys)
#   <release-name>-dynamic-plugins-registry-auth (OCI dynamic-plugin pull)
#
# sync-wave -1 so both Secrets exist before the portal Deployment is
# admitted (missing pull secret = pod stuck in CreateContainerConfigError).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rhaap-portal-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: secrets-rhaap-portal
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: aap-host-url
      remoteRef:
        key: rhaap-portal/portal
        property: aap-host-url
    - secretKey: oauth-client-id
      remoteRef:
        key: rhaap-portal/portal
        property: oauth-client-id
    - secretKey: oauth-client-secret
      remoteRef:
        key: rhaap-portal/portal
        property: oauth-client-secret
    - secretKey: aap-token
      remoteRef:
        key: rhaap-portal/portal
        property: aap-token
---
# Upstream naming convention: <release-name>-dynamic-plugins-registry-auth.
# .Release.Name is pinned to `redhat-rhaap-portal` by the workloads AppSet
# (releaseName = path basename), hence the template below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rhaap-portal-registry-auth
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: "{{ .Release.Name }}-dynamic-plugins-registry-auth"
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: auth.json
      remoteRef:
        key: rhaap-portal/registry-auth
        property: auth.json
