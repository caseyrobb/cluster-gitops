{{- if .Values.store.enabled }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.store.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: external-secrets-operator
    app.kubernetes.io/component: store
spec:
  provider:
    vault:
      server: {{ .Values.store.server }}
      path: {{ .Values.store.mountPath }}
      version: Kv2
      auth:
        kubernetes:
          # The operand's projected SA token (rotating, bound-audience)
          # authenticates against Vault's auth/ocp kubernetes method.
          path: {{ .Values.store.authPath }}
          serviceAccountRef:
            name: {{ .Values.store.serviceAccountRef.name }}
            namespace: {{ .Values.store.serviceAccountRef.namespace }}
{{- end }}
