{{- if .Values.enabled }}
{{- with .Values.network }}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ .lanNadName }}
  namespace: {{ $.Values.namespace.name }}
  annotations:
    # NAD CRD is created by the cluster (Multus), not by Git.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/name: {{ $.Chart.Name }}
spec:
  # L2 attachment for VMs: macvlan children on the OCP node's br-ex.
  # (The physical uplink is enslaved to OVS in OVN-K OVN mode — macvlan on
  # the NIC itself fails "device or resource busy"; br-ex works — verified
  # 2026-11-06 with a multus test pod.) Guests set their own static
  # addresses (see the butane NM keyfile), so no IPAM block is needed.
  config: '{"cniVersion":"0.4.0","name":"{{ .lanNadName }}","type":"macvlan","master":"{{ .macvlanMaster }}","mode":"{{ .mode }}"}'
{{- end }}
{{- end }}
