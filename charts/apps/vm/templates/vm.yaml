{{- if .Values.enabled }}
{{- range $name, $vm := .Values.vms }}
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace.name }}
  annotations:
    # The VirtualMachine CRD is owned by the OpenShift Virtualization
    # operator, not by Git.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    k8s.v1.cni.cncf.io/networks: '[{"name": "{{ $vm.networks.lanNad }}", "interface": "lan0"}]'
  labels:
    app.kubernetes.io/name: {{ $.Chart.Name }}
spec:
  runStrategy: {{ $vm.runStrategy | default "Always" }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $.Chart.Name }}
        app.kubernetes.io/instance: {{ $name }}
    spec:
      domain:
        cpu:
          cores: {{ $vm.cpu }}
        memory:
          guest: {{ $vm.memory }}
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: datadisk
              disk:
                bus: virtio
          interfaces:
            # MACs are declared, not generated: the guest NetworkManager
            # keyfile binds the static LAN profile by MAC, so NIC PCI
            # enumeration order (enp2s0 vs enp3s0) can never break it.
            - name: default
              macAddress: {{ $vm.macAddresses.default }}
              masquerade: {}
            - name: lan0
              macAddress: {{ $vm.macAddresses.lan }}
              {{- if $vm.networks.lanBinding }}
              # Registered on the HyperConverged CR (macvlan -> managedTap);
              # the legacy bridge binding cannot wire a macvlan child.
              binding:
                name: {{ $vm.networks.lanBinding }}
              {{- else }}
              bridge: {}
              {{- end }}
      evictionStrategy: {{ $vm.evictionStrategy | default "LiveMigrate" }}
      networks:
        - name: default
          pod: {}
        - name: lan0
          multus:
            networkName: {{ $vm.networks.lanNad }}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: rootdisk
          dataVolume:
            name: {{ $name }}-root
        - name: datadisk
          persistentVolumeClaim:
            claimName: {{ $vm.dataDisk.pvcName }}
        {{- range $sv := $vm.secretVolumes }}
        # Secret volumes mount over virtiofs; the guest ignition mounts the
        # tag (= volume name) at /run/secrets/<name> and podman quadlet
        # units read EnvironmentFile from there. Nothing secret is written
        # to the disk image.
        - name: {{ $sv }}
          secret:
            secretName: {{ $sv }}
        {{- end }}
        - name: cloudinit
          cloudInitNoCloud:
            secretRef:
              name: {{ $vm.cloudInit.secretName }}
  dataVolumeTemplates:
    # Root disk: cloned from the golden-image DataSource (RWO lvms clone).
    # Ephemeral by design — FCOS is immutable; all state lives on the data
    # disk PVC.
    - metadata:
        name: {{ $name }}-root
      spec:
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: {{ $vm.rootDisk.size }}
          storageClassName: {{ $.Values.storageClass }}
          volumeMode: Block
        # Embedded-DV-schema sourceRef: kind/name/namespace only — no
        # apiGroup (verified against the product VM CRD; the standalone
        # DataVolume CRD's dataSourceRef does not apply here).
        sourceRef:
          kind: DataSource
          name: {{ $vm.rootDisk.dataSource }}
        preallocation: false
{{- end }}
{{- end }}
