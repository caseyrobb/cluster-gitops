{{- if .Values.enabled }}
{{- range $vmName, $vm := .Values.vms }}
{{- range $es := $vm.externalSecrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $es.name }}
  namespace: {{ $.Values.namespace.name }}
  annotations:
    # ExternalSecret CRD is created by the Red Hat ESO operator, not by Git.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/name: {{ $.Chart.Name }}
    app.kubernetes.io/instance: {{ $vmName }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.secretStore.name }}
  # ESO webhook defaults declared explicitly (same rationale as the
  # cert-manager ExternalSecret: omitted fields get added live by the
  # webhook and Argo then sees permanent drift).
  target:
    name: {{ $es.name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $d := $es.data }}
    - secretKey: {{ $d.secretKey }}
      remoteRef:
        key: {{ $d.vaultPath }}
        property: {{ $d.property }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
