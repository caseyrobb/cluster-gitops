# Set false per-cluster in values/clusters/<name>/cert-manager.yaml to opt out.
enabled: true
subscription:
  channel: stable-v1
  installPlanApproval: Automatic   # flip to Manual for production-grade pinning

# ACME via Cloudflare DNS-01 (disabled by default; enable per cluster).
acme:
  enabled: false
  server: https://acme-v02.api.letsencrypt.org/directory
  email: ""
  issuerName: letsencrypt
  # cert-manager operator namespace (Subscription-installed).
  # Ground-truth operand ns (verified: deploy/cert-manager -n cert-manager).
  certManagerNamespace: cert-manager
  secretStore: vault
  # Vault KV v2 path (under the store's mount) holding {"api-token": "..."}
  vaultPath: ocp/cloudflare-api-token
  tokenSecret:
    name: cloudflare-api-token
    key: api-token
  routerCert:
    name: router-wildcard-cert
    secretNamespace: openshift-ingress
    keyAlgorithm: ECDSA
    dnsNames:
    - apps.ocp.redcomet.ca
    - "*.apps.ocp.redcomet.ca"
