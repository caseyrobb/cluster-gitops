{{- if and .Values.enabled .Values.scaleSet.enabled }}
{{- /*
  GitHub PAT for the caseyrobb runner scale set flows:
  Vault chaos/data/<vaultPath>  --(ESO ClusterSecretStore 'vault')-->  this
  secret in actions-runner-system, refreshed hourly. The scale set chart is
  fed the secret NAME (string form of githubConfigSecret), so the PAT never
  touches Git or values files. Key `github_token` is what the ARC v2
  controller expects for a classic PAT.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: caseyrobb-github-config
  labels:
    app.kubernetes.io/name: actions-runner-system
    app.kubernetes.io/component: github-auth
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.githubAuth.secretStore }}
  # Fields below are ESO webhook defaults, declared explicitly on purpose:
  # omitted here, the mutating webhook adds them live, Argo then sees a
  # diff forever (selfHeal churn: apply -> webhook re-adds -> OutOfSync).
  target:
    name: {{ (index .Values "gha-runner-scale-set").githubConfigSecret }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: {{ .Values.githubAuth.tokenKey }}
    remoteRef:
      key: {{ .Values.githubAuth.vaultPath }}
      property: {{ .Values.githubAuth.tokenKey }}
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
{{- end }}
