# Per-cluster overrides for cluster "ocp" (must match the cluster secret name).
# Base chart: charts/platform/cert-manager — this file only carries the delta.
enabled: true
subscription:
  channel: stable-v1

# Public ACME wildcard for the router via Cloudflare DNS-01.
# Delegation: redcomet.ca NS = Cloudflare (registrar); token in Vault at
# chaos/data/ocp/cloudflare-api-token (Zone/DNS/Edit scoped to redcomet.ca).
acme:
  enabled: true
  email: caseyrobb@pm.me
