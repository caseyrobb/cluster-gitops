# ocp (homelab) overlay — OpenShift Compliance Operator.
# Operator (stable channel, v1.10.1) installed via PR #52; scan verified
# against the live profile catalog 2026-11-13 (ocp4-moderate /
# ocp4-moderate-node = NIST 800-53 Revision 4 Moderate baseline).
# settingsRef 'default' = no auto-remediation (remediation review is a
# separate, deliberate step — do NOT switch to default-auto-apply casually;
# moderate-baseline remediations can cut lab connectivity).
enabled: true
scan:
  enabled: true
  settingsRef: default
  profiles:
    - ocp4-moderate
    - ocp4-moderate-node
