# KubeVirt workload chart (workloads ApplicationSet: charts/apps/<name> ->
# namespace <name>, project: workloads). Renders golden-image DataSources
# disk images pulled via CDI http import.
#
# Master switch for the whole chart; per-cluster overlays set false to
# prune (app stays Synced/Healthy rendering nothing).
enabled: true

# Destination namespace name only. The chart MUST NOT render a Namespace
# resource: Namespace is cluster-scoped and the workloads AppProject denies
# cluster-scoped resources by design (its sync is rejected outright:
# "resource :Namespace is not permitted in project workloads"). The
# workloads ApplicationSet's CreateNamespace=true creates/adopts it.
namespace:
  name: vm

# Golden-image pattern (like openshift-virtualization-os-images): a
# DataSource names the populated PVC so VMs consume it via
# dataSourceRef, and its labels drive default instancetype/preference
# selection. The backing DataVolume is managed outside this chart for
# now (imperative in-cluster); if it moves into GitOps, re-add a
# datavolume template alongside so the whole pipeline is Git-owned.
dataSources:
  fedora-coreos-44-amd64:
    source:
      pvc:
        name: fedora-coreos-44-amd64
        namespace: vm
    labels:
      instancetype.kubevirt.io/default-preference: fedora
      instancetype.kubevirt.io/default-preference-kind: VirtualMachineClusterPreference
      template.kubevirt.io/architecture: amd64
# VolumeImportSources: the populator source objects (source of truth for
# the image URL). CDI creates these from a DataVolume's spec.source and
# GARBAGE-COLLECTS them once the import completes — so Git must carry
# them or the populator flow is not reproducible. Name must match what
# PVCs' spec.dataSourceRef references (CDI derives
# volume-import-source-<dv-uid>); spec mirrored from live DV
# fedora-coreos-44-amd64 (Verified 2026-11-06).
volumeImportSources:
  # IMPORTANT: import the *raw* metal disk with contentType 'data'.
  # The -kubevirt.ociarchive is a container-image tar wrapper, NOT a
  # disk image; importing it (contentType kubevirt) produced a PVC full
  # of OCI-layout bytes -> SeaBIOS 'Boot failed: not a bootable disk'
  # (proven via VNC console on pangolin-test, 2026-11-08). The metal
  # raw.xz is the BIOS+UEFI bootable disk; CDI transparently
  # decompresses .xz for contentType data.
  volume-import-source-a99319d7-2dfd-45f8-bb25-f0f3d2b8de4d:
    contentType: data
    source:
      http:
        url: https://builds.coreos.fedoraproject.org/prod/streams/stable/builds/44.20261023.3.1/x86_64/fedora-coreos-44.20261023.3.1-metal.x86_64.raw.xz

# Golden-image PVCs, populated via dataSourceRef -> VolumeImportSource
# (populator path). Everything the CDI controller/binder stamped is
# mirrored verbatim so SSA adoption is zero-drift (same technique as the
# AAP instance adoption); spec.volumeName is the ONE field deliberately
# absent — it is bind-time-only and hard-coding it would break PVC
# recreation. ApplicationSet workloads carries a narrow ignoreDifferences
# for /spec/volumeName. PVC was populated WITHOUT preallocation and WITH
# bind.immediate — populator + http works fine under those conditions
# (revises the PR #23 conclusion: the real fix was bind.immediate alone).
persistentVolumeClaims:
  fedora-coreos-44-amd64:
    labels:
      app: containerized-data-importer
      app.kubernetes.io/component: storage
      app.kubernetes.io/managed-by: cdi-controller
      app.kubernetes.io/part-of: hyperconverged-cluster
      app.kubernetes.io/version: "4.22.12"
      instancetype.kubevirt.io/default-preference: fedora
      instancetype.kubevirt.io/default-preference-kind: VirtualMachineClusterPreference
    annotations:
      cdi.kubevirt.io/storage.bind.immediate.requested: "true"
      cdi.kubevirt.io/storage.usePopulator: "true"
    spec:
      accessModes:
        - ReadWriteOnce
      dataSource:
        apiGroup: cdi.kubevirt.io
        kind: VolumeImportSource
        name: volume-import-source-a99319d7-2dfd-45f8-bb25-f0f3d2b8de4d
      dataSourceRef:
        apiGroup: cdi.kubevirt.io
        kind: VolumeImportSource
        name: volume-import-source-a99319d7-2dfd-45f8-bb25-f0f3d2b8de4d
      resources:
        requests:
          storage: "10737418240"
      storageClassName: lvms-vg1
      volumeMode: Block
  # Blank data disk for the pangolin-test VM (no dataSource -> plain PVC).
  # Formatted xfs + mounted by the VM ignition on first boot; persists
  # across VM re-creation because this PVC is Git-owned, not a
  # dataVolumeTemplate child of the VM.
  pangolin-test-data:
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
      storageClassName: lvms-vg1
      volumeMode: Block

# Storage class for VM root/data disks (Block volumeMode).
storageClass: lvms-vg1

# ClusterSecretStore providing VM ignition + env from Vault.
secretStore:
  name: vault

# L2 network for VMs: macvlan NAD on the OCP node bridge that carries the
# LAN (OVN-K OVN mode enslaves the physical NIC to OVS; br-ex is the
# working master — verified 2026-11-06).
network:
  # VM LAN path: node-local linux bridge (nmstate NNCP br-vm on the free
  # NIC — see charts/platform/openshift-nmstate ocp overlay) + cnv-bridge
  # NAD. macvlan-on-br-ex was proven non-functional for VMs on OVN-K OVN
  # mode (multus macvlan child never enslaved to the kubevirt tap bridge).
  enabled: true
  lanNadName: lan0
  bridgeName: br-vm

# VirtualMachines, one map entry per VM (key = VM name).
vms:
  pangolin-test:
    cpu: 2
    memory: 4Gi
    runStrategy: Always
    # LiveMigrate over node eviction; if CSI snapshot-based hotplug
    # migration misbehaves on LVMS, switch to DoNotEvict in the overlay.
    evictionStrategy: LiveMigrate
    networks:
      lanEnabled: true
      lanNad: lan0
      # cnv-bridge NAD uses kubevirt's legacy bridge binding; the named
      # macvlan/managedTap registration (openshift-cnv overlay) stays
      # registered but unused — set for macvlan-type NADs only.
      lanBinding: ""
    # Locally-administered unicast (02:), documented in the .bnt keyfile —
    # keep in sync with [ethernet] mac-address there.
    macAddresses:
      default: "02:1a:11:00:00:01"
      lan: "02:1a:11:00:00:02"
    rootDisk:
      # Golden image cloned per-VM from this DataSource (RWO clone).
      dataSource: fedora-coreos-44-amd64
      size: 10Gi
    dataDisk:
      # Persistent (standalone PVC, NOT a dataVolumeTemplate) so app state
      # survives VM object deletion/re-creation.
      pvcName: pangolin-test-data
    # Masquerade SLIRP forwards: every Service port must appear here.
    ports:
      - port: 22
      - port: 80
      - port: 443
      - port: 3001
    service:
      enabled: true
      type: NodePort
      ports:
        - name: ssh
          port: 22
          targetPort: 22
          nodePort: 30022
        - name: http
          port: 80
          targetPort: 80
          nodePort: 30080
        - name: https
          port: 443
          targetPort: 443
          nodePort: 30443
        - name: pangolin
          port: 3001
          targetPort: 3001
          nodePort: 30301
    cloudInit:
      # Secret (userData key) synced from Vault by the ExternalSecret
      # below; rendered from charts/apps/vm/ignition/pangolin-test.bnt via
      # scripts/render-vm-ignition.sh.
      secretName: pangolin-test-ignition
    secretVolumes:
      # Mounted via virtiofs at /run/secrets/<name> by the guest ignition.
      - pangolin-env
    # One ExternalSecret per name; each may carry multiple Vault keys into
    # the SAME Secret (one list entry per name — two list entries with the
    # same name would render two same-named ES objects, last-wins, and one
    # Vault key would silently never reach the Secret).
    externalSecrets:
      - name: pangolin-test-ignition
        data:
          - vaultPath: vm/pangolin-test
            property: ignition
            secretKey: userData
      - name: pangolin-env
        data:
          - vaultPath: vm/pangolin-test
            property: pangolin-env
            secretKey: pangolin.env
          # newt tunnel env (NEWT_MODE=tunnel client variables).
          - vaultPath: vm/pangolin-test
            property: newt-env
            secretKey: newt.env
