{{- if .Values.oauth.enabled }}
{{- /*
  Client secret for the OAuth identity provider. Vault is the single source;
  the chaos keycloak-operator reads the SAME path to register the client.
  Webhook-default fields declared explicitly (learned in PR #7: omitted
  defaults => perpetual selfHeal churn).
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.oauth.clientSecretName }}
  namespace: openshift-config
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: openshift-oauth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.oauth.secretStore }}
  target:
    name: {{ .Values.oauth.clientSecretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: clientSecret
    remoteRef:
      key: {{ .Values.oauth.vaultPath }}
      property: {{ .Values.oauth.vaultProperty }}
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
{{- end }}
