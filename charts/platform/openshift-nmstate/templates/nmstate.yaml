{{- if .Values.enabled }}
{{- if .Values.nmstate.create }}
apiVersion: nmstate.io/v1
# Kind capitalisation matters: the CRD (live cluster and upstream) declares
# `NMState`, not `Nmstate`.
kind: NMState
metadata:
  name: nmstate
  namespace: {{ .Values.namespace.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # The NMState CRD is created by the OLM operator, not by Git, so the type
    # is unknown to the API server on first sync — skip the dry run for
    # missing resource types instead of failing the sync.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/name: openshift-nmstate
    app.kubernetes.io/component: handler
# Empty spec = operator defaults (NMState DaemonSet on every node, Linux
# bridge support). NodeNetworkConfigurationPolicy CRs (the actual network
# configs) are workload-level and deliberately NOT managed here.
spec: {}
{{- end }}
{{- end }}
