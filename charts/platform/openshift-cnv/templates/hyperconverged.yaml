{{- if .Values.enabled }}
{{- if .Values.hyperconverged.create }}
apiVersion: hco.kubevirt.io/v1beta1
kind: HyperConverged
metadata:
  # HCO accepts EXACTLY one instance, in the operator's namespace. The product
  # CRD (hyperconvergeds.hco.kubevirt.io, verified on the live 4.22.20
  # cluster) pins metadata.name via an OpenAPI pattern to
  # `kubevirt-hyperconverged` on both v1 and v1beta1. A `cluster`-named CR is
  # rejected by validation and the HCO operator then loops on
  # "No HyperConverged resource".
  name: kubevirt-hyperconverged
  namespace: {{ .Values.namespace.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # The HyperConverged CRD is created by the OLM operator, not by Git, so
    # the type is unknown to the API server on first sync — skip the dry-run
    # for missing resource types instead of failing the sync.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/name: openshift-cnv
    app.kubernetes.io/component: virt
# Empty spec = Red Hat defaults. HCO fills the observed spec in status; it
# does not mutate spec, so selfHeal is safe. Tune live-migration,
# infraStorage, or resource quotas here deliberately when needed.
spec: {}
{{- end }}
{{- end }}
