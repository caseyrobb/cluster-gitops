apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workloads
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/caseyrobb/cluster-gitops.git
              revision: HEAD
              directories:
                - path: charts/apps/*
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  env: homelab
  template:
    metadata:
      name: '{{.name}}-{{.path.basename}}'
    spec:
      ignoreDifferences:
        # KubeVirt mutating webhook stamps defaults onto the VM template
        # (pci-topology annotation, architecture, MAC addresses, firmware
        # serial/uuid, machine type, resources {}) — Git never declares
        # them, Argo would show permanent OutOfSync.
        - group: kubevirt.io
          kind: VirtualMachine
          jsonPointers:
            - /spec/template/metadata/annotations
            - /spec/template/spec/architecture
            - /spec/template/spec/domain/devices/interfaces
            - /spec/template/spec/domain/firmware
            - /spec/template/spec/domain/machine
            - /spec/template/spec/domain/resources
        # spec.volumeName is stamped by the pv binder at first bind and
        # must NOT live in Git: hard-coding it would break a recreated
        # golden-image PVC (the PV name would not exist yet). Owned by
        # another SSA field manager, so ArgoCD cannot clear it — but it
        # would still flag the PVC OutOfSync without this rule.
        - group: ""
          kind: PersistentVolumeClaim
          jsonPointers:
            - /spec/volumeName
            # CDI runtime stamps mutate on every fresh import (prime name,
            # progress, pod state) and pv.* bind stamps arrive at bind
            # time; the chart declares only the stable behavioral ones
            # (bind.immediate, usePopulator). Ignored so re-imports don't
            # pin the PVC permanently OutOfSync (golden-image rework
            # 2026-11-08).
            - /metadata/annotations/cdi.kubevirt.io~1createdForDataVolume
            - /metadata/annotations/cdi.kubevirt.io~1storage.condition.running
            - /metadata/annotations/cdi.kubevirt.io~1storage.condition.running.message
            - /metadata/annotations/cdi.kubevirt.io~1storage.condition.running.reason
            - /metadata/annotations/cdi.kubevirt.io~1storage.contentType
            - /metadata/annotations/cdi.kubevirt.io~1storage.pod.phase
            - /metadata/annotations/cdi.kubevirt.io~1storage.pod.restarts
            - /metadata/annotations/cdi.kubevirt.io~1storage.pod.schedulable
            - /metadata/annotations/cdi.kubevirt.io~1storage.populator.progress
            - /metadata/annotations/cdi.kubevirt.io~1storage.populator.pvcPrime
            - /metadata/annotations/cdi.kubevirt.io~1storage.preallocation.requested
            - /metadata/annotations/pv.kubernetes.io~1bind-completed
            - /metadata/annotations/pv.kubernetes.io~1bound-by-controller
            # SSA list semantics: declaring ownerReferences: [] cannot clear
            # entries owned by another field manager (cdi-controller stamped
            # one when the PVC was DV-created) — verified 2026-11-06 by SSA
            # server dry-run: the entry survives the apply. ArgoCD would flag
            # the PVC OutOfSync forever, so ignore the field; the chart still
            # declares [] (clean object on recreation) and the live entry is
            # detached once imperatively after first sync, so deleting the
            # source DataVolume no longer cascades to the golden PVC.
      project: workloads
      source:
        repoURL: https://github.com/caseyrobb/cluster-gitops.git
        targetRevision: HEAD
        path: '{{.path.path}}'
        helm:
          releaseName: '{{.path.basename}}'
          valueFiles:
            - values.yaml
            - '../../../values/clusters/{{.name}}/{{.path.basename}}.yaml'
          ignoreMissingValueFiles: true
      destination:
        server: '{{.server}}'
        namespace: '{{.path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - AdoptExistingResources=true
