{{- if .Values.enabled }}
{{- if .Values.aapmcp.create }}
apiVersion: mcpserver.ansible.com/v1alpha1
kind: AnsibleMCPServer
metadata:
  # Deployed by the AAP resource operator (aap-mcp-server-operator) into the
  # AAP namespace. Labels verified from the live CR 2026-11-06 (operator
  # writes them; declared so ArgoCD shows no drift).
  name: {{ .Values.aapmcp.name }}
  namespace: {{ .Values.namespace.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    # CRD is installed by the operator, not by Git — skip dry-run when the
    # type is not yet known to the API server.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/managed-by: ansible-mcp-server-operator
    app.kubernetes.io/name: aapmcp
    app.kubernetes.io/operator-version: ""
    app.kubernetes.io/part-of: aapmcp
# Mirrors the live CR (2026-11-06). Inbound auth is a static bearer token
# generated by the operator into Secret `aap-gateway-oauth2-token-secret`
# (key `token`) — never store token material in Git.
spec:
  {{- toYaml .Values.aapmcp.spec | nindent 2 }}
{{- end }}
{{- end }}
