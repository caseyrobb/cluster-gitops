# Red Hat ESO lifecycle is OLM-driven (Subscription), packaged here as a chart
# per this repo's GitOps convention. The operand (external-secrets, webhook,
# cert-controller in namespace `external-secrets`) is reconciled by the
# operator from the ExternalSecretsConfig CR — the ONLY supported way to
# customize it (direct edits to operand resources get overwritten).

operatorGroup:
  # Required: the operator lives in its own namespace, so OLM needs a
  # cluster-wide OperatorGroup there (RH ESO is cluster-wide only).
  enabled: true

subscription:
  package: openshift-external-secrets-operator
  channel: stable-v1
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  # Flip to Manual for production-grade version pinning.
  installPlanApproval: Automatic

# Cluster-scoped operand config (name is fixed: "cluster").
operand:
  create: true
  spec: {}

# ClusterSecretStore (Vault backend). Disabled by default; enable per cluster
# in values/clusters/<cluster>/<chart>.yaml.
store:
  enabled: false
  name: vault
  server: https://vault.neozeon.ca
  # KV v2 mount in Vault holding this cluster's secrets (the store-level
  # path; per-secret subpaths are chosen by each ExternalSecret).
  mountPath: chaos
  # Vault kubernetes auth mount for this cluster (role binds the operand SA).
  authPath: ocp
  # Vault role under authPath (RH operand v1 schema requires it explicitly).
  role: external-secrets
  # KV version enum is lowercase in the RH operand (v1|v2).
  version: v2
  # Destination CIDRs allowed for the operand's Vault egress (the operator's
  # eso-sys-deny-all-traffic only allows DNS + API server). Set per cluster,
  # e.g. the VIP the hostname resolves to on the LAN.
  egressCidrs: []
  tokenReviewer:
    # SA + RBAC so Vault (not system:anonymous) can create TokenReviews on
    # OpenShift. The issued JWT lives only in Vault's auth/<path> config.
    create: true
  serviceAccountRef:
    name: external-secrets
    namespace: external-secrets
