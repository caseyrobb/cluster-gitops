{{- if .Values.operatorGroup.enabled }}
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: ansible-automation-platform-operator
  namespace: {{ .Values.namespace.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: ansible-automation-platform
    app.kubernetes.io/component: operator
# SingleNamespace mode REQUIRED on the standard stable-2.7 channel: its
# bundle declares only the SingleNamespace install mode, and a cluster-wide
# group (spec: {}) makes OLM fail the CSV with UnsupportedOperatorGroup
# ("AllNamespaces InstallModeType not supported") — verified live.
# AAP instances therefore live in this same namespace (Red Hat's standard
# topology). Want cross-namespace instances? Switch subscription.channel to
# stable-2.7-cluster-scoped instead.
spec:
  targetNamespaces:
  - {{ .Values.namespace.name }}
{{- end }}
